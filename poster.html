<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leo Lü — 海报设计 Poster Design</title>
<style>
  html, body { overflow-x: clip; touch-action: pan-y; } /* 触屏禁横向滚动，杜绝穿页 */

  @font-face {
    font-family: "Outfit";
    src: url("./fonts/outfit-600-latin.woff2") format("woff2");
    font-weight: 600;
  }
  @font-face {
    font-family: "Outfit";
    src: url("./fonts/outfit-400-latin.woff2") format("woff2");
    font-weight: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #ffffff; /* 纯白背景，海报是唯一视觉焦点 */
    overflow: hidden;
    font-family: "Outfit", sans-serif;
    -webkit-font-smoothing: antialiased;
    opacity: 0; /* 入场渐显（与全站一致，0.5s） */
    transition: opacity 0.5s ease;
  }
  body.in { opacity: 1; }

  /* ===== 漂浮海报舞台：固定 1440×900 设计画布，整体等比缩放适配任意窗口 ===== */
  .stage {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 1440px;
    height: 900px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    perspective: 2000px;
    perspective-origin: 35% 65%; /* 透视原点：容器中心偏左下 */
    transform-style: preserve-3d;
    z-index: 1;
  }

  /* 漂浮定位层：负责位置 + 上下左右飘动（必须包在卡片外面，
     否则图片会在卡片盒内移位、露出页面白底形成"立体白边"） */
  .float {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w);
    z-index: var(--zi);
    will-change: translate; /* 飘动走合成层，避免入场卡顿 */
    animation: drift var(--fd, 6s) ease-in-out var(--fdel, 0s) infinite;
  }
  @keyframes drift {
    0%   { translate: -4px -3px; }
    25%  { translate:  3px -5px; }
    50%  { translate:  5px  3px; }
    75%  { translate: -2px  4px; }
    100% { translate: -4px -3px; }
  }

  .poster {
    position: relative;
    width: 100%;
    transform: translate(-50%, -50%) var(--t);
    cursor: pointer;
    border-radius: 2px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.12),
      0 5px 15px rgba(0, 0, 0, 0.08);
    transition:
      transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    /* 入场：从下方飘入，延迟递增（由内联 --d 控制） */
    animation: posterIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) var(--d) backwards;
  }
  @keyframes posterIn {
    from {
      opacity: 0;
      translate: 0 90px;
      scale: 0.94;
    }
    to {
      opacity: 1;
      translate: 0 0;
      scale: 1;
    }
  }

  .poster img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
  }

  /* 悬停：轻微抬起、阴影加深（z-index 要加在定位层上） */
  .float:hover { z-index: 999; }
  .poster:hover {
    transform: translate(-50%, -50%) var(--t) scale(1.04);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.18),
      0 8px 22px rgba(0, 0, 0, 0.1);
  }

  /* ===== 灯箱：点击后海报放大在屏幕中央，背景压暗 ===== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(250, 250, 250, 0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  .lightbox.open { opacity: 1; visibility: visible; }
  .lightbox img {
    /* 等比例放大：保留每张海报原始比例，不裁切不加白框 */
    max-width: 80vw;
    max-height: 84vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 3px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.25);
    transform: scale(0.92);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .lightbox.open img { transform: scale(1); }
  .lightbox .close {
    position: absolute;
    top: 3.5vh;
    right: 3vw;
    color: #111111;
    font-size: 34px;
    cursor: pointer;
    line-height: 1;
    opacity: 0.7;
  }
  .lightbox .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #111111;
    font-size: 40px;
    cursor: pointer;
    padding: 20px;
    opacity: 0.45;
    user-select: none;
    transition: opacity 0.3s;
  }
  .lightbox .nav:hover { opacity: 1; }
  .lightbox .prev { left: 2vw; }
  .lightbox .next { right: 2vw; }
  .lightbox .counter {
    position: absolute;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(17, 17, 17, 0.6);
    font-size: 12px;
    letter-spacing: 0.3em;
  }

  /* 左上角返回 */
  .back {
    position: fixed;
    left: 3vw;
    top: 4vh;
    z-index: 3;
    color: #111111;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.75;
    transition: opacity 0.3s;
  }
  .back:hover { opacity: 0.4; }

  /* ===== 右上角：跳转其他板块 ===== */
  .site-nav {
    position: fixed;
    right: 3vw;
    top: calc(4vh + 28px); /* 避开 page-label */
    z-index: 3;
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .site-nav a {
    color: rgba(17, 17, 17, 0.7);
    text-decoration: none;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.08em;
    transition: opacity 0.25s;
  }
  .site-nav a:hover { opacity: 0.4; }
  .site-nav a.here { color: #9B30FF; font-weight: 600; pointer-events: none; }

  /* 页面上方小标 */
  .page-label {
    position: fixed;
    top: 4vh;
    right: 3vw;
    z-index: 1000; /* 永远浮在海报之上，避免被遮挡 */
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(17, 17, 17, 0.5);
  }

  /* 右下角：Leo Lü */
  .brand {
    position: fixed;
    right: 3vw;
    bottom: 4.5vh;
    z-index: 3;
    text-align: right;
    color: #111111;
    pointer-events: none;
  }
  .brand .name {
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-weight: 700;
    font-size: clamp(24px, 2.6vw, 38px);
    letter-spacing: 0.14em;
  }
  .brand .sub {
    margin-top: 8px;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  /* 移动端：同样靠整体缩放适配，无需特殊处理 */
  @media (max-width: 768px) {
    .back { font-size: 12px; }
  }
</style>
</head>
<body>

  <a class="back" href="index.html#works">← Back · 返回</a>
  <div class="page-label">Poster Design · 海报设计</div>

  <nav class="site-nav">
    <a class="here" href="poster.html">海报设计 Poster</a>
    <a href="longform.html">长图文设计 Long-form</a>
    <a href="photography.html">摄影 Photography</a>
    <a href="newmedia.html">新媒体运营 New Media</a>
    <a href="branding.html">品牌策划 Branding</a>
    <a href="vibecoding.html">Vibe Coding</a>
  </nav>

  <div class="stage" id="stage"></div>

  <div class="brand">
    <div class="name">Leo Lü</div>
    <div class="sub">Poster Design · 海报设计</div>
  </div>

  <div class="lightbox" id="lightbox">
    <span class="close" id="lbClose">×</span>
    <span class="nav prev" id="lbPrev">‹</span>
    <img id="lbImg" alt="海报作品">
    <span class="nav next" id="lbNext">›</span>
    <div class="counter" id="lbCounter"></div>
  </div>

<script>
  // 入场渐显
  requestAnimationFrame(() => document.body.classList.add("in"));

  const POSTERS = Array.from({ length: 11 }, (_, k) =>
    `poster/photos/poster${String(k + 1).padStart(2, "0")}.jpg`
  );

  /* 随意散落布局：每张海报位置、大小、角度都不同，互不重叠，
     整体呈凌乱漂浮感。x/y 为 1440×900 设计画布的百分比；w 宽度 px。 */
  const LAYOUT = [
    { x: 8,  y: 24, w: 180, ry: -14, rx:  6, rz: -9, z:  60 },
    { x: 19, y: 68, w: 200, ry:  10, rx: -5, rz:  5, z: 120 },
    { x: 30, y: 32, w: 168, ry:  18, rx:  8, rz: -4, z:  30 },
    { x: 42, y: 74, w: 208, ry:  -8, rx: -7, rz:  7, z: 150 },
    { x: 45, y: 17, w: 163, ry: -20, rx:  4, rz: 11, z:  80 },
    { x: 57, y: 48, w: 198, ry:  12, rx: 10, rz: -6, z: 180 },
    { x: 68, y: 16, w: 178, ry: -16, rx: -6, rz:  8, z:  40 },
    { x: 70, y: 72, w: 172, ry:  20, rx:  5, rz: -10, z: 100 },
    { x: 83, y: 44, w: 205, ry: -10, rx: -9, rz:  3, z: 140 },
    { x: 89, y: 13, w: 158, ry:  15, rx:  7, rz: -7, z:  20 },
    { x: 92, y: 74, w: 182, ry: -18, rx: -4, rz:  9, z:  90 },
  ];

  const stage = document.getElementById("stage");

  // 设计画布 1440×900，整体等比缩放适配窗口
  function fitStage() {
    stage.style.setProperty("--s", Math.min(innerWidth / 1440, innerHeight / 900));
  }
  fitStage();
  window.addEventListener("resize", fitStage);

  POSTERS.forEach((src, idx) => {
    const L = LAYOUT[idx % LAYOUT.length];
    const wrap = document.createElement("div");
    wrap.className = "float";
    wrap.style.setProperty("--x", L.x + "%");
    wrap.style.setProperty("--y", L.y + "%");
    wrap.style.setProperty("--w", L.w + "px");
    wrap.style.setProperty("--zi", Math.round(L.z));
    const fd = (5.6 + (idx % 5) * 0.7).toFixed(2);              // 5.6s ~ 8.4s 不同周期
    wrap.style.setProperty("--fd", fd + "s");
    // 负延迟：动画从周期中段直接开始，避免入场瞬间从 0 帧"跳"到起始帧的卡顿
    wrap.style.setProperty("--fdel", (-(idx * 0.53 + 1.2)).toFixed(2) + "s");
    const el = document.createElement("div");
    el.className = "poster";
    el.style.setProperty("--t",
      `translateZ(${L.z}px) rotateY(${L.ry}deg) rotateX(${L.rx}deg) rotateZ(${L.rz}deg)`);
    el.style.setProperty("--d", (idx * 0.1).toFixed(1) + "s"); // 入场延迟递增 0.1s
    el.innerHTML = `<img src="${src}" alt="海报作品 ${idx + 1}">`;
    el.addEventListener("click", () => openLightbox(idx));
    wrap.appendChild(el);
    stage.appendChild(wrap);
  });

  // ===== 灯箱：点击后放大在屏幕中央，背景压暗 =====
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbCounter = document.getElementById("lbCounter");
  let cur = 0;

  function openLightbox(i) {
    cur = i;
    lbImg.src = POSTERS[cur];
    lbCounter.textContent = `${cur + 1} / ${POSTERS.length}`;
    lb.classList.add("open");
  }
  function step(d) {
    cur = (cur + d + POSTERS.length) % POSTERS.length;
    lbImg.src = POSTERS[cur];
    lbCounter.textContent = `${cur + 1} / ${POSTERS.length}`;
  }
  document.getElementById("lbClose").addEventListener("click", () => lb.classList.remove("open"));
  document.getElementById("lbPrev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
  document.getElementById("lbNext").addEventListener("click", e => { e.stopPropagation(); step(1); });
  lb.addEventListener("click", e => { if (e.target === lb) lb.classList.remove("open"); });
  window.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") lb.classList.remove("open");
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });
</script>
<style>[id*="netlify" i],[class*="netlify" i],iframe[srcdoc*="Netlify"]{display:none!important}</style>
<script>
/* 移除 Netlify 免费版注入的右下角徽标 */
(function () {
  const kill = () => {
    document.querySelectorAll('[id*="netlify" i],[class*="netlify" i]').forEach(e => e.remove());
    // HUD 徽标是 srcdoc iframe，直接按内容识别并移除；同时掐掉它的脚本
    document.querySelectorAll('script[src*="/.netlify/"],script[data-netlify-site-id]').forEach(e => e.remove());
    document.querySelectorAll('iframe[srcdoc]').forEach(f => { if ((f.getAttribute('srcdoc') || '').includes('Netlify')) f.remove(); });
  };
  kill();
  new MutationObserver(kill).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
</body>
